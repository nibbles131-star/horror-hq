[package]
name = "horror-hq"
version = "0.5.0"
description = "Horror HQ"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
serde_json = "1"
rust_xlsxwriter = "0.99"
sha2 = "0.10"

[profile.release]
strip = true
