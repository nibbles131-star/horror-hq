<script>
/* Pure Bestiary Codex logic, shared with the Node tests (tools/app_test.js). Reads live data only: no extra monster metadata to maintain. */
var CodexLogic = (function () {
  var NUMERALS = [['M', 1000], ['CM', 900], ['D', 500], ['CD', 400], ['C', 100], ['XC', 90], ['L', 50], ['XL', 40], ['X', 10], ['IX', 9], ['V', 5], ['IV', 4], ['I', 1]];
  function roman(n) {
    var out = '';
    NUMERALS.forEach(function (p) { while (n >= p[1]) { out += p[0]; n -= p[1]; } });
    return out;
  }

  /** The Bestiary chapters in their stored order, each with tiers from the frozen trophy ladder (same numbers as Stats + Trophies). */
  function chapters(M, HQ) {
    var t = HQ.trophies(M);
    var byName = {};
    t.bestiary.forEach(function (b) { byName[b.name] = b; });
    return M.collList.filter(function (c) { return c.family === 'Bestiary'; }).map(function (c, i) {
      var b = byName[c.name] || { watched: 0, listed: 0, earned: null, next: null };
      var films = specimens(M, c.collection_id);
      return { n: i + 1, numeral: roman(i + 1), coll: c, watched: b.watched, listed: b.listed, earned: b.earned, next: b.next,
        films: films, unexplored: b.watched === 0, featured: featured(films) };
    });
  }

  /** One chapter's films in list order (unique), with the list entry kept for its position. */
  function specimens(M, collId) {
    var seen = {}, out = [];
    (M.entriesByColl[collId] || []).forEach(function (e, i) {
      if (seen[e.film]) return;
      seen[e.film] = true;
      out.push({ film: M.byId[e.film], entry: e, n: i + 1 });
    });
    return out;
  }

  function rated(f) { return f.rating !== null && f.rating !== undefined; }

  /** Highest-rated watched film; with none, the first one still waiting in list order. */
  function featured(list) {
    var best = null;
    list.forEach(function (s) {
      if (s.film.status === 'Watched' && rated(s.film) && (!best || s.film.rating > best.film.rating)) best = s;
    });
    if (best) return { spec: best, kind: 'best' };
    var w = list.filter(function (s) { return s.film.status === 'Watched'; })[0];
    if (w) return { spec: w, kind: 'watched' };
    var next = list.filter(function (s) { return s.film.status === 'Not watched'; })[0];
    return next ? { spec: next, kind: 'awaiting' } : null;
  }

  /** Chapter filter + sort. show: '' | watched | unwatched | dnf. sort: order | rating | year | title. */
  function filter(list, show, sort) {
    var out = list.filter(function (s) {
      var st = s.film.status;
      if (show === 'watched') return st === 'Watched';
      if (show === 'unwatched') return st === 'Not watched' || st === 'Unsure';
      if (show === 'dnf') return st === 'DNF';
      return true;
    });
    var byTitle = function (a, b) { return a.film.key.localeCompare(b.film.key); };
    if (sort === 'rating') out.sort(function (a, b) { return (rated(b.film) ? b.film.rating : -1) - (rated(a.film) ? a.film.rating : -1) || byTitle(a, b); });
    else if (sort === 'year') out.sort(function (a, b) { return (a.film.year || 9999) - (b.film.year || 9999) || byTitle(a, b); });
    else if (sort === 'title') out.sort(byTitle);
    return out;
  }

  /** Other Bestiary chapters (and other lists) a film genuinely sits on. Nothing invented. */
  function crossRefs(M, filmId, exceptCollId) {
    var beasts = [], lists = [], seen = {};
    (M.entriesByFilm[filmId] || []).forEach(function (e) {
      var c = M.coll[e.coll];
      if (!c || seen[c.collection_id] || c.collection_id === exceptCollId) return;
      seen[c.collection_id] = true;
      (c.family === 'Bestiary' ? beasts : lists).push(c);
    });
    return { beasts: beasts, lists: lists };
  }

  /** Newest Bestiary additions, newest first, judged by entry id (ids only ever count up). */
  function recent(M, limit) {
    var seen = {};
    return Object.keys(M.entryById).map(function (id) { return M.entryById[id]; })
      .filter(function (e) { return M.coll[e.coll] && M.coll[e.coll].family === 'Bestiary'; })
      .sort(function (a, b) { return (Number(String(b.id).replace(/\D/g, '')) || 0) - (Number(String(a.id).replace(/\D/g, '')) || 0); })
      .filter(function (e) { if (seen[e.film]) return false; seen[e.film] = true; return true; })
      .slice(0, limit || 8)
      .map(function (e) { return { film: M.byId[e.film], coll: M.coll[e.coll] }; });
  }

  /** Master of Beasts: the existing Beastmaster trophy (unique films across every chapter) plus seal tallies. */
  function master(M, HQ, chs) {
    var t = HQ.trophies(M);
    var bm = t.core.filter(function (c) { return c.family === 'Beastmaster'; })[0] || { value: 0, ladder: [], earned: null, next: null };
    var seals = { Bronze: 0, Silver: 0, Gold: 0 };
    chs.forEach(function (c) {
      t.bestiaryLadder.forEach(function (d) { if (c.watched >= d.threshold) seals[d.tier] = (seals[d.tier] || 0) + 1; });
    });
    var catalogued = {};
    chs.forEach(function (c) { c.films.forEach(function (s) { catalogued[s.film.id] = 1; }); });
    return { beastmaster: bm, seals: seals, catalogued: Object.keys(catalogued).length, explored: chs.filter(function (c) { return !c.unexplored; }).length,
      platinum: t.platinum };
  }

  return { roman: roman, chapters: chapters, specimens: specimens, featured: featured, filter: filter, crossRefs: crossRefs, recent: recent, master: master };
})();

    'Aquatic / Sirens / Merfolk': { c1: '#3a8fd9', c2: '#04142a', ep: 'Of salt, scale and the song beneath the waves.',
      lore: 'The water keeps its secrets. Sirens call sailors to the rocks, gill-men stalk black lagoons and something always rises from the deep. Never trust a calm sea.' },
    'Cryptids & Humanoid Monsters': { c1: '#b88a5a', c2: '#1f140a', ep: 'Footprints in the mud. Shapes between the trees.',
      lore: 'Half rumour, half beast. Things the locals stopped talking about decades ago, glimpsed at the treeline and never quite photographed. The blurry ones are always the real ones.' },
    'Cosmic & Eldritch Entities': { c1: '#a06bff', c2: '#170a2b', ep: 'That which should not be, yet always was.',
      lore: 'Geometry that bends the wrong way. Gods older than light, colours with no name and knowledge that costs you your mind. To understand them is to be lost.' },
    'Curses & Supernatural Entities': { c1: '#d9cf8a', c2: '#1c1a0c', ep: 'Spoken once. Paid forever.',
      lore: 'A videotape, a chain letter, a word whispered in the wrong place. Curses never chase you. They follow, patiently, until the debt is collected.' },
    'Demons & Devils': { c1: '#ff4a2a', c2: '#2a0804', ep: 'Summoned, bargained, cast out, returned.',
      lore: 'Possession, pacts and the long patience of hell. The priest is always too late and the Latin never quite works. Something in the house already knows your name.' },
    'Dolls, Puppets & Possessed Objects': { c1: '#e8d6c0', c2: '#221a14', ep: 'Glass eyes. Stitched smiles. Eternal company.',
      lore: 'Porcelain faces, ventriloquist dummies and toys that move when you look away. They only want to play. Forever, ideally.' },
    'Folkloric Entities': { c1: '#8fbf7a', c2: '#10190c', ep: 'Old stories, told for a reason.',
      lore: 'Spirits of the wood, the thing in the well, whatever your grandmother warned you about. Folk tales were never meant for children; they were warnings dressed up as bedtime stories.' },
    'Ghosts & Hauntings': { c1: '#a9bccf', c2: '#10161d', ep: 'The dead do not always rest.',
      lore: 'Cold spots, slamming doors and a figure at the end of the hallway. Some houses remember everything that happened inside them, and some guests never check out.' },
    'Killer Animals & Nature Attacks': { c1: '#d0703a', c2: '#220e05', ep: 'Nature bites back.',
      lore: 'Sharks, swarms, birds and very, very angry dogs. The food chain has opinions, and it has finally decided to share them. You are going to need a bigger boat.' },
    'Mutants, Experiments & Monstrous Transformations': { c1: '#ff4fd8', c2: '#2a0624', ep: 'Flesh, unmade and remade.',
      lore: 'Lab accidents, radiation and bodies that refuse to stay the shape they were born. Science asked whether it could. Nobody stopped to ask whether it should.' },
    'Vampires': { c1: '#c4213f', c2: '#2a0610', ep: 'Of blood, hunger and eternal night.',
      lore: 'They do not age, they do not die, and somehow they are always invited in. Aristocrats, nomads and things in the attic, every one of them with the same old thirst.' },
    'Werewolves': { c1: '#e0b860', c2: '#1d150a', ep: 'Of flesh, fur and the beast within.',
      lore: 'Curses passed through blood. Humanity surrendered beneath the full moon. The monster is not always the creature lurking in the forest.' },
    'Witches': { c1: '#39c47e', c2: '#061a10', ep: 'Of covens, candles and the old craft.',
      lore: 'Burned, drowned, and still they gather. Covens in the woods, hexes in a lock of hair and grandmothers who are not what they seem. Hail whoever is listening.' },
    'Zombies & Infected': { c1: '#a3b84a', c2: '#171a07', ep: 'The dead walk. The living run out of options.',
      lore: 'It starts with one bite and ends with the whole world. Shamblers, sprinters and the infected: hunger without a mind, crowds without an end. Aim for the head.' }
  };
  var DEFAULT_LORE = { c1: '#b8925a', c2: '#1f140a', ep: 'A chapter yet unwritten.', lore: 'The pages here are still blank, waiting for whatever crawls in next.' };
  var TIER_FLAVOUR = { Bronze: 'First encounter', Silver: 'Seasoned hunter', Gold: 'Master of the species' };
  var SHOW = [['', 'All specimens'], ['watched', 'Sighted'], ['unwatched', 'Unconfirmed'], ['dnf', 'Fled (DNF)']];
  var SORT = [['order', 'Codex order'], ['rating', 'By rating'], ['year', 'By release year'], ['title', 'By title']];
  var STATUS_WORDS = { 'Watched': 'Sighted · watched', 'Not watched': 'Unconfirmed · not watched', 'DNF': 'Fled the scene · DNF', 'Unsure': 'Disputed · unsure' };
  var st = { ch: null, show: '', sort: 'order', rec: null };

  function lore(c) { return LORE[c.name] || DEFAULT_LORE; }
  function vars(c) { var l = lore(c); return '--c1:' + l.c1 + ';--c2:' + l.c2; }
  function shortName(c) { return c.name.split(/ \/ | & |, /)[0]; }

  function seal(tier, label) {
    return '<span class="seal ' + (tier || 'none') + '" title="' + (tier ? tier + ' seal' : 'No seal yet') + '">' + (label || (tier ? tier.charAt(0) : '?')) + '</span>';
  }

  function poster(a, f, dim, extra) {
    return '<div class="cx-p' + (dim ? ' dim' : '') + '">' +
      (f.poster ? '<img loading="lazy" src="' + a.esc(f.poster) + '" alt="' + a.esc(f.title) + '">' : '<div class="noimg">' + a.esc(f.title) + '</div>') +
      (extra || '') + '</div>';
  }

  function nextLine(ch) {
    if (!ch.next) return 'Gold earned';
    var need = ch.next.threshold - ch.watched;
    return need + ' more to ' + ch.next.tier;
  }

  function goldPct(ch, ladder) {
    var gold = ladder.length ? ladder[ladder.length - 1].threshold : 10;
    return Math.min(1, ch.watched / gold);
  }

  // ------------------------------------------------------------------ the entrance
  function renderIndex(a, M) {
    var chs = CodexLogic.chapters(M, HQ);
    var ladder = HQ.trophies(M).bestiaryLadder;
    var m = CodexLogic.master(M, HQ, chs);
    var bm = m.beastmaster;
    var bmTop = bm.ladder.length ? bm.ladder[bm.ladder.length - 1].threshold : 50;
    var recent = CodexLogic.recent(M, 10);
    var chapterOf = {};
    chs.forEach(function (c) { chapterOf[c.coll.collection_id] = c; });

    var covers = chs.map(function (ch) {
      var l = lore(ch.coll), bg = ch.featured && ch.featured.spec.film.poster;
      return '<div class="cx-cover' + (ch.unexplored ? ' unx' : '') + '" style="' + vars(ch.coll) + '" data-cxopen="' + a.esc(ch.coll.collection_id) + '">' +
        (bg && !ch.unexplored ? '<div class="bgp" style="background-image:url(&quot;' + a.esc(bg) + '&quot;)"></div>' : '') +
        '<div class="num">CHAPTER ' + ch.numeral + '</div>' +
        '<div class="medal">' + a.esc(ch.coll.icon || '❦') + (ch.earned ? seal(ch.earned.tier) : '') + '</div>' +
        '<div class="nm">' + a.esc(ch.coll.name) + '</div>' +
        '<div class="ep">' + a.esc(l.ep) + '</div>' +
        '<div class="foot"><div class="cx-bar"><i style="width:' + (goldPct(ch, ladder) * 100) + '%"></i></div>' +
          (ch.listed ? ch.watched + ' sighted of ' + ch.listed + ' · ' + a.esc(nextLine(ch)) : 'No specimens catalogued yet') + '</div>' +
      '</div>';
    }).join('');

    return '<div class="codex">' +
      '<div class="cx-book">' +
        '<div class="cx-kicker">The Archives of the Unnatural</div>' +
        '<div class="cx-title">The Horror Bestiary</div>' +
        '<div class="cx-sub">' + a.esc(numberWord(chs.length)) + ' families. Countless nightmares.</div>' +
        '<div class="cx-rule"></div>' +
        '<div class="cx-master"><div><h3>⚜ Master of Beasts</h3>' +
          '<div class="small muted">Unique films sighted across every chapter. A creature filed under two chapters only counts once here.</div>' +
          '<div class="cx-ladder">' + bm.ladder.map(function (d) {
            return '<div class="cx-rung' + (bm.value >= d.threshold ? ' on' : '') + '"><b>' + (bm.value >= d.threshold ? '✦ ' : '') + a.esc(d.name) + '</b><span>' + d.tier + ' · ' + d.threshold + ' unique</span></div>';
          }).join('') + '</div>' +
          '<div class="cx-bar"><i style="width:' + Math.min(100, bm.value / bmTop * 100) + '%"></i></div>' +
          '<div class="small" style="margin-top:6px"><b>' + bm.value + '</b> unique specimens sighted of ' + m.catalogued + ' catalogued' +
            (bm.next ? ' · ' + (bm.next.threshold - bm.value) + ' more for ' + a.esc(bm.next.name) : ' · the title is yours') + '.</div></div>' +
          '<div><div class="cx-tally">' + ['Bronze', 'Silver', 'Gold'].map(function (t) {
            return '<div>' + seal(t) + '<b>' + (m.seals[t] || 0) + '</b><small> / ' + chs.length + '</small><br><small>' + TIER_FLAVOUR[t] + '</small></div>';
          }).join('') + '</div>' +
          '<div class="small muted" style="text-align:center;margin-top:12px">' + m.explored + ' of ' + chs.length + ' chapters explored' +
            (m.platinum && m.platinum.def ? ' · Bestiary Golds toward Platinum: <b>' + m.platinum.bestiaryGolds + '/' + m.platinum.def.threshold + '</b>' : '') + '</div></div>' +
        '</div>' +
      '</div>' +
      (recent.length ? '<div class="cx-pane"><h3>Recently catalogued specimens</h3><div class="cx-recent">' + recent.map(function (r) {
          var ch = chapterOf[r.coll.collection_id];
          return '<div class="rc cx-spec" style="' + vars(r.coll) + '" data-cxrec="' + a.esc(r.film.id) + '" data-cxin="' + a.esc(r.coll.collection_id) + '">' +
            poster(a, r.film, r.film.status !== 'Watched' && r.film.status !== 'DNF') +
            '<small>' + a.esc(r.film.title) + '<br><span style="color:' + lore(r.coll).c1 + '">' + a.esc(r.coll.icon || '') + ' ' + a.esc(shortName(r.coll)) + (ch ? ' · ' + ch.numeral : '') + '</span></small></div>';
        }).join('') + '</div></div>' : '') +
      '<div class="cx-covers">' + covers + '</div>' +
    '</div>';
  }

  function numberWord(n) {
    var w = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen'];
    return w[n] || String(n);
  }

  // ------------------------------------------------------------------ a chapter
  function renderChapter(a, M) {
    var chs = CodexLogic.chapters(M, HQ);
    var i = chs.map(function (c) { return c.coll.collection_id; }).indexOf(st.ch);
    var ch = chs[i], prev = chs[(i - 1 + chs.length) % chs.length], next = chs[(i + 1) % chs.length];
    var l = lore(ch.coll);
    var ladder = HQ.trophies(M).bestiaryLadder;
    var list = CodexLogic.filter(ch.films, st.show, st.sort);
    var ratedFilms = ch.films.filter(function (s) { return s.film.status === 'Watched' && s.film.rating !== null && s.film.rating !== undefined; });
    var avg = ratedFilms.length ? Math.round(ratedFilms.reduce(function (s, x) { return s + Number(x.film.rating); }, 0) / ratedFilms.length * 10) / 10 : null;
    var fe = ch.featured;
    var dnf = ch.films.filter(function (s) { return s.film.status === 'DNF'; }).length;

    var grid = list.map(function (s) {
      var f = s.film, xr = CodexLogic.crossRefs(M, f.id, ch.coll.collection_id).beasts.length;
      var r = f.rating !== null && f.rating !== undefined;
      return '<div class="cx-spec" data-cxrec="' + a.esc(f.id) + '" data-cxin="' + a.esc(ch.coll.collection_id) + '">' +
        poster(a, f, f.status !== 'Watched' && f.status !== 'DNF',
          (f.status === 'DNF' ? '<span class="stamp">DNF</span>' : '') +
          (xr ? '<span class="xr" title="Also filed in ' + xr + ' other chapter' + (xr === 1 ? '' : 's') + '">⇄ ' + xr + '</span>' : '') +
          (r && f.status === 'Watched' ? '<span class="drop">' + f.rating + '</span>' : '') +
          '<span class="edit" data-film="' + a.esc(f.id) + '" title="Open the film drawer">✎</span>') +
        '<div class="lbl">' + a.esc(f.title) + '<span>' + a.esc(f.year || 'year unknown') + ' · ' + a.esc(STATUS_WORDS[f.status] || f.status) + '</span></div></div>';
    }).join('');

    return '<div class="codex" style="' + vars(ch.coll) + '">' +
      '<div class="cx-nav"><button class="btn" data-cxindex>☰ Codex index</button><span class="grow"></span>' +
        '<button class="btn" data-cxopen="' + a.esc(prev.coll.collection_id) + '" title="' + a.esc(prev.coll.name) + '">← ' + a.esc(prev.coll.icon || '') + ' ' + prev.numeral + '</button>' +
        '<button class="btn" data-cxopen="' + a.esc(next.coll.collection_id) + '" title="' + a.esc(next.coll.name) + '">' + next.numeral + ' ' + a.esc(next.coll.icon || '') + ' →</button></div>' +
      '<div class="cx-book cx-head">' +
        '<div class="cx-kicker">Chapter ' + ch.numeral + ' · The Bestiary</div>' +
        '<div class="ico" style="margin-top:12px">' + a.esc(ch.coll.icon || '❦') + '</div>' +
        '<div class="cx-title">' + a.esc(ch.coll.name) + '</div>' +
        '<div class="cx-sub">' + a.esc(l.ep) + '</div>' +
        '<div class="cx-rule"></div>' +
        '<div class="cx-lore">' + a.esc(l.lore) + '</div>' +
        (ch.coll.description ? '<div class="small muted" style="margin-top:12px">' + a.esc(ch.coll.description) + '</div>' : '') +
      '</div>' +
      '<div class="cx-two"><div>' +
        '<div class="cx-pane"><h3>Your field research</h3>' +
          '<div class="cx-ladder">' + ladder.map(function (d) {
            var on = ch.watched >= d.threshold;
            return '<div class="cx-rung' + (on ? ' on' : '') + '" style="display:flex;gap:10px;align-items:center">' + seal(on ? d.tier : null, on ? d.tier.charAt(0) : d.threshold) +
              '<div><b>' + a.esc(TIER_FLAVOUR[d.tier] || d.tier) + '</b><span>' + d.tier + ' · ' + d.threshold + ' watched</span></div></div>';
          }).join('') + '</div>' +
          '<div class="cx-bar"><i style="width:' + (goldPct(ch, ladder) * 100) + '%;background:linear-gradient(90deg, color-mix(in srgb, var(--c1) 55%, #000), var(--c1));box-shadow:0 0 12px var(--c1)"></i></div>' +
          '<div class="small" style="margin-top:8px"><b>' + ch.watched + '</b> sighted of ' + ch.listed + ' catalogued · ' + a.esc(nextLine(ch)) +
            (avg !== null ? ' · average rating <b>' + avg + '</b>' : '') + (dnf ? ' · ' + dnf + ' fled' : '') +
            (ch.listed < 10 ? ' · <span style="color:var(--c1)">this chapter needs ' + (10 - ch.listed) + ' more films catalogued before Gold is even possible</span>' : '') + '</div>' +
        '</div>' +
        '<h3 class="fell" style="font-weight:400;font-size:24px;margin:4px 0 12px;color:var(--parch)">Specimens in this chapter</h3>' +
        '<div class="cx-tools"><div class="seg">' + SHOW.map(function (o) {
            return '<button data-cxshow="' + o[0] + '" class="' + (st.show === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
          }).join('') + '</div><select data-cxsort>' + SORT.map(function (o) {
            return '<option value="' + o[0] + '"' + (st.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
          }).join('') + '</select><span class="grow"></span><span class="small muted">' + list.length + ' specimen' + (list.length === 1 ? '' : 's') + ' · click one for its record, ✎ for the film drawer</span></div>' +
        (grid ? '<div class="cx-grid">' + grid + '</div>' : '<div class="cx-pane empty">' + (ch.films.length ? 'No specimens match that filter.' : 'Not a single specimen catalogued. Send the Horror Excavator hunting.') + '</div>') +
      '</div><div>' +
        (fe ? '<div class="cx-pane cx-feat"><div class="tag">' + (fe.kind === 'best' ? 'PRIZE SPECIMEN' : fe.kind === 'watched' ? 'FIRST SIGHTING' : 'AWAITING FIRST SIGHTING') + '</div>' +
          '<div class="cx-spec" data-cxrec="' + a.esc(fe.spec.film.id) + '" data-cxin="' + a.esc(ch.coll.collection_id) + '">' +
            poster(a, fe.spec.film, fe.kind === 'awaiting', fe.kind === 'best' ? '<span class="drop">' + fe.spec.film.rating + '</span>' : '') + '</div>' +
          '<div class="ttl">' + a.esc(fe.spec.film.key) + '</div>' +
          '<div class="small" style="text-align:center;margin-top:4px">' + (fe.kind === 'best' ? 'Your highest-rated sighting in this chapter.' : fe.kind === 'watched' ? 'Sighted, but you never rated it. Rude.' : 'Next in the chapter. It is waiting for you.') + '</div></div>' : '') +
        '<div class="cx-pane"><h3>Chapter index</h3>' + chs.map(function (c) {
          return '<div class="row" style="cursor:pointer;' + (c === ch ? 'color:var(--c1)' : '') + '" data-cxopen="' + a.esc(c.coll.collection_id) + '"><span class="t small">' + c.numeral + ' · ' + a.esc(c.coll.icon || '') + ' ' + a.esc(shortName(c.coll)) + '</span>' +
            (c.earned ? seal(c.earned.tier).replace('class="seal ', 'style="width:22px;height:22px;font-size:10px" class="seal ') : '<span class="small faint">' + c.watched + '</span>') + '</div>';
        }).join('') + '</div>' +
      '</div></div>' +
    '</div>';
  }

  // ------------------------------------------------------------------ specimen record
  function renderRecord(a, M) {
    var f = M.byId[st.rec.film];
    if (!f) { st.rec = null; return ''; }
    var here = M.coll[st.rec.coll];
    var xr = CodexLogic.crossRefs(M, f.id, here ? here.collection_id : null);
    var chs = CodexLogic.chapters(M, HQ), num = {};
    chs.forEach(function (c) { num[c.coll.collection_id] = c.numeral; });
    var r = f.rating !== null && f.rating !== undefined;
    var stampWord = f.status === 'Watched' ? 'SIGHTED' : f.status === 'DNF' ? 'FLED' : f.status === 'Unsure' ? 'DISPUTED' : 'AT LARGE';
    var notes = String(f.reaction || '').trim();
    return '<div class="cx-rec" data-cxrecclose><div class="cx-card" style="' + (here ? vars(here) : '') + '">' +
      '<span class="close" data-cxrecclose title="Close">✕</span>' +
      '<div>' + poster(a, f, false) + '</div>' +
      '<div><div class="hd"><span>SPECIMEN RECORD</span><span>No. ' + a.esc(f.id) + '</span></div>' +
        '<span class="stampx">' + stampWord + '</span>' +
        '<h2>' + a.esc(f.key) + '</h2>' +
        '<dl>' +
          (here ? '<dt>Classification</dt><dd>' + a.esc(here.icon || '') + ' ' + a.esc(here.name) + (num[here.collection_id] ? ' (Chapter ' + num[here.collection_id] + ')' : '') + '</dd>' : '') +
          '<dt>Release</dt><dd>' + a.esc(f.year || 'unknown') + '</dd>' +
          (f.countries.length ? '<dt>Origin</dt><dd>' + a.esc(f.countries.join(', ')) + '</dd>' : '') +
          '<dt>Status</dt><dd>' + a.esc(STATUS_WORDS[f.status] || f.status) + '</dd>' +
          '<dt>Threat rating</dt><dd>' + (r ? '<b>' + f.rating + '/10</b> · ' + a.esc(HQ.verdict(f.rating).label) : 'Not yet assessed') + '</dd>' +
          (f.aliases.length ? '<dt>Also known as</dt><dd>' + a.esc(f.aliases.map(function (x) { return x.key; }).join('; ')) + '</dd>' : '') +
        '</dl>' +
        (notes ? '<div class="notes">“' + a.esc(notes.length > 320 ? notes.slice(0, 317) + '…' : notes) + '”</div>' : '') +
        '<div style="font-family:var(--fell);color:#6a4a2a;margin:6px 0">Cross-referenced in other chapters</div>' +
        (xr.beasts.length ? xr.beasts.map(function (c) {
          return '<span class="xchip" data-cxopen="' + a.esc(c.collection_id) + '">' + a.esc(c.icon || '') + ' ' + a.esc(c.name) + (num[c.collection_id] ? ' · ' + num[c.collection_id] : '') + '</span>';
        }).join('') : '<div style="font-size:14px;margin-bottom:6px">Filed in this chapter alone.</div>') +
        (xr.lists.length ? '<div style="font-family:var(--fell);color:#6a4a2a;margin:8px 0 6px">Also on your lists</div>' + xr.lists.map(function (c) {
          return '<span class="xchip plain">' + a.esc(c.icon || '') + ' ' + a.esc(c.name) + '</span>';
        }).join('') : '') +
        '<div style="margin-top:14px"><button class="btn primary" data-cxdrawer="' + a.esc(f.id) + '">📂 Open film file</button></div>' +
      '</div></div></div>';
  }

  function render(a) {
    var M = a.model();
    if (st.ch && !M.coll[st.ch]) st.ch = null;
    var html = st.ch ? renderChapter(a, M) : renderIndex(a, M);
    return html + (st.rec ? renderRecord(a, M) : '');
  }

  function onClick(ev, a) {
    var t = ev.target.closest('[data-cxopen],[data-cxindex],[data-cxshow],[data-cxrec],[data-cxrecclose],[data-cxdrawer],[data-film]');
    if (!t) return false;
    var d = t.dataset;
    if (d.film !== undefined && !d.cxdrawer) { st.rec = null; return false; } // let the app open its own drawer
    if (d.cxdrawer) { st.rec = null; a.render(); a.openFilm(d.cxdrawer); return true; }
    if (d.cxopen) {
      if (st.ch !== d.cxopen) { st.show = ''; st.sort = 'order'; }
      st.ch = d.cxopen; st.rec = null; window.scrollTo(0, 0); a.render(); return true;
    }
    if (d.cxindex !== undefined) { st.ch = null; st.rec = null; window.scrollTo(0, 0); a.render(); return true; }
    if (d.cxshow !== undefined) { st.show = d.cxshow; a.render(); return true; }
    if (d.cxrec) { st.rec = { film: d.cxrec, coll: d.cxin }; a.render(); return true; }
    if (d.cxrecclose !== undefined) {
      if (ev.target !== t) return true; // clicks inside the card don't close it
      st.rec = null; a.render(); return true;
    }
    return false;
  }

  function onChange(ev, a) {
    if (ev.target.dataset.cxsort === undefined) return false;
    st.sort = ev.target.value;
    a.render();
    return true;
  }

  /** Lets other sections open the Codex at a chapter. */
  window.CodexView = { open: function (collId) { st.ch = collId || null; st.rec = null; } };

  App.view('codex', { render: function (a) { return a.topBar('Bestiary Codex', 'A cursed field guide to every creature you have catalogued. 📜') + render(a); },
    onClick: onClick, onChange: onChange });
})();
</script>
