<script>
/* Pure collection maths, shared with the Node tests (tools/app_test.js). */
var CollLogic = (function () {
  /** Same rule as the old Franchise Tracker helper column N. */
  function franchiseState(watched, total, unsure) {
    if (unsure > 0) return 'Needs review';
    if (watched === 0) return 'Not started';
    if (watched >= total) return 'Complete';
    if (watched / total >= 0.8) return 'Nearly complete';
    return 'In progress';
  }

  /** Progress for one list, counting unique films (a film listed twice counts once). */
  function progress(M, collId) {
    var es = M.entriesByColl[collId] || [];
    var seen = {}, films = [];
    es.forEach(function (e) { if (!seen[e.film]) { seen[e.film] = true; films.push(M.byId[e.film]); } });
    var count = function (s) { return films.filter(function (f) { return f.status === s; }).length; };
    var rated = films.filter(function (f) { return f.rating !== null && f.rating !== undefined; });
    var next = null;
    es.some(function (e) { var f = M.byId[e.film]; if (f.status === 'Not watched') { next = f; return true; } return false; });
    return {
      total: films.length, entries: es.length, watched: count('Watched'), dnf: count('DNF'), unsure: count('Unsure'),
      notWatched: count('Not watched'), rated: rated.length,
      avg: rated.length ? rated.reduce(function (s, f) { return s + Number(f.rating); }, 0) / rated.length : null,
      pct: films.length ? count('Watched') / films.length : 0, next: next
    };
  }

  /** Totals for a whole family, unique films across its lists. */
  function familyProgress(M, family) {
    var seen = {}, watched = 0, total = 0;
    M.collList.forEach(function (c) {
      if (c.family !== family) return;
      (M.entriesByColl[c.collection_id] || []).forEach(function (e) {
        if (seen[e.film]) return;
        seen[e.film] = true;
        total++;
        if (M.byId[e.film].status === 'Watched') watched++;
      });
    });
    return { watched: watched, total: total, lists: M.collList.filter(function (c) { return c.family === family; }).length };
  }

  /** Bestiary tier earned for a watched count, from the frozen ladder (1 / 5 / 10). */
  function bestiaryTier(M, watched) {
    var ladder = M.raw.trophies.filter(function (d) { return d.family === 'Bestiary category'; })
      .sort(function (a, b) { return a.threshold - b.threshold; });
    var earned = null;
    ladder.forEach(function (d) { if (watched >= d.threshold) earned = d.tier; });
    return earned;
  }

  /**
   * One franchise as filmstrip frames, in the list's own order (the order you set with the arrows).
   * Watched and DNF light up (DNF gets marked), Unsure and Not watched stay dark. The first Not watched
   * entry overall is next up (same as progress().next); each branch track also gets its own trackNext.
   * branches = { entry_id: 'Branch name' }; entries without one sit on the main line ('').
   */
  function filmstrip(M, collId, branches) {
    branches = branches || {};
    var es = M.entriesByColl[collId] || [];
    var nextDone = false, trackDone = {};
    return es.map(function (e, i) {
      var f = M.byId[e.film];
      var br = String(branches[e.id] || '').trim();
      var open = f.status === 'Not watched';
      var next = !nextDone && open;
      if (next) nextDone = true;
      var trackNext = open && !trackDone[br];
      if (trackNext) trackDone[br] = true;
      return { n: i + 1, entry: e, film: f, branch: br, lit: f.status === 'Watched' || f.status === 'DNF', dnf: f.status === 'DNF',
        unsure: f.status === 'Unsure', next: next, trackNext: trackNext };
    });
  }

  /** Splits frames into tracks: the main line first, then each branch in the order it first appears. */
  function tracks(frames) {
    var out = [{ name: '', frames: [] }], at = { '': out[0] };
    frames.forEach(function (fr) {
      if (!at[fr.branch]) { at[fr.branch] = { name: fr.branch, frames: [] }; out.push(at[fr.branch]); }
      at[fr.branch].frames.push(fr);
    });
    return out.filter(function (t) { return t.frames.length; });
  }

  /** Franchises for the Filmstrip tab: filtered by state and sorted. */
  function filmstrips(M, show, sort) {
    var allBranches = (M.raw.fun && M.raw.fun.franchise_branches) || {};
    var out = M.collList.filter(function (c) { return c.family === 'Franchise'; }).map(function (c) {
      var p = progress(M, c.collection_id);
      var frames = filmstrip(M, c.collection_id, allBranches[c.collection_id]);
      return { coll: c, p: p, state: franchiseState(p.watched, p.total, p.unsure), frames: frames, tracks: tracks(frames) };
    }).filter(function (x) {
      if (show === 'going') return x.state === 'In progress' || x.state === 'Nearly complete' || x.state === 'Needs review';
      if (show === 'fresh') return x.state === 'Not started';
      if (show === 'done') return x.state === 'Complete';
      return true;
    });
    var byName = function (a, b) { return a.coll.name.localeCompare(b.coll.name); };
    if (sort === 'az') out.sort(byName);
    else if (sort === 'close') out.sort(function (a, b) {
      var ad = a.p.total && a.p.pct < 1, bd = b.p.total && b.p.pct < 1;
      return (bd - ad) || (b.p.pct - a.p.pct) || byName(a, b);
    });
    return out;
  }

  /**
   * Which complete franchises still need a party. seen null = first run: everything already complete
   * counts as celebrated. A franchise that stops being complete (new entry) drops out, so finishing it again parties again.
   */
  function celebrations(seen, completeIds) {
    if (!seen) return { done: completeIds.slice(), fresh: [] };
    var kept = seen.filter(function (id) { return completeIds.indexOf(id) >= 0; });
    var fresh = completeIds.filter(function (id) { return kept.indexOf(id) < 0; });
    return { done: kept.concat(fresh), fresh: fresh };
  }

  return { franchiseState: franchiseState, progress: progress, familyProgress: familyProgress, bestiaryTier: bestiaryTier,
    filmstrip: filmstrip, tracks: tracks, filmstrips: filmstrips, celebrations: celebrations };
})();
if (typeof module !== 'undefined') module.exports = CollLogic;
</script>

<script>
/* Collections: every list family, its lists, and each list's films in order. */
(function () {
  var FAMILIES = [
    { id: 'Yearly', icon: '📆', blurb: 'The yearly main list and its honourable mentions.' },
    { id: 'Seasonal', icon: '🎃', blurb: 'Countdowns and event lists. Dates live in the Watch Planner.' },
    { id: 'Curated', icon: '🩸', blurb: 'Hand-built themed lists.' },
    { id: 'Classics', icon: '🦇', blurb: 'Hammer, Universal, Paramount, RKO and MGM.' },
    { id: 'Bestiary', icon: '👹', blurb: 'Fifteen locked creature categories. Gold means 10 watched in a category.' },
    { id: 'Alphabet', icon: '🔤', blurb: 'One film per letter.' },
    { id: 'Franchise', icon: '🔪', blurb: 'Every franchise in order, with Unsure for the murky bits.' },
    { id: 'Bubblegum', icon: '🫧', blurb: 'Rated /10 for quality and /5 on the Cuntometer. Never the same thing.' }
  ];
  var LOCKED = { Bestiary: true, Classics: true };
  var TIER_ICON = { Bronze: '🥉', Silver: '🥈', Gold: '🥇' };
  var st = { family: 'Yearly', coll: null, show: '', q: '', fsShow: '', fsSort: 'order', fsSize: 120, fsScroll: {}, fsEdit: '' };
  var FS_SHOW = [['', 'All'], ['going', 'On the go'], ['fresh', 'Not started'], ['done', 'Complete']];
  var FS_SORT = [['order', 'Your order'], ['close', 'Closest to done'], ['az', 'A to Z']];
  var FS_SIZES = [['S', 92], ['M', 120], ['L', 160]];

  function stateBadge(s) {
    var cls = s === 'Complete' ? 'Watched' : s === 'Needs review' ? 'Unsure' : s === 'Not started' ? 'Not' : '';
    return '<span class="status ' + cls + '">' + s + '</span>';
  }

  function renderOverview(a, M) {
    var fam = FAMILIES.filter(function (f) { return f.id === st.family; })[0];
    var tabs = '<div class="seg" style="flex-wrap:wrap">' + FAMILIES.map(function (f) {
      var p = CollLogic.familyProgress(M, f.id);
      return '<button data-cfam="' + f.id + '" class="' + (st.family === f.id ? 'on' : '') + '">' + f.icon + ' ' + f.id +
        ' <span class="small" style="opacity:.7">' + p.watched + '/' + p.total + '</span></button>';
    }).join('') + '<button data-cfam="Filmstrip" class="' + (st.family === 'Filmstrip' ? 'on' : '') + '">🎞️ Filmstrip</button></div>';
    if (st.family === 'Filmstrip') return renderFilmstrip(a, M, tabs);
    var colls = M.collList.filter(function (c) { return c.family === st.family; });
    var fp = CollLogic.familyProgress(M, st.family);
    var cards = colls.map(function (c) {
      var p = CollLogic.progress(M, c.collection_id);
      var extra = '';
      if (c.family === 'Franchise') extra = stateBadge(CollLogic.franchiseState(p.watched, p.total, p.unsure));
      if (c.family === 'Bestiary') {
        var tier = CollLogic.bestiaryTier(M, p.watched);
        extra = tier ? '<span class="chip">' + TIER_ICON[tier] + ' ' + tier + '</span>' : '<span class="chip">No trophy yet</span>';
      }
      return '<div class="panel click-card" data-copen="' + a.esc(c.collection_id) + '">' +
        '<div class="row" style="border:0;padding:0 0 8px"><span class="t"><b>' + a.esc(c.icon) + ' ' + a.esc(c.name) + '</b></span>' + extra + '</div>' +
        '<div class="bar"><i style="width:' + (p.pct * 100) + '%"></i></div>' +
        '<div class="small muted" style="margin-top:8px">' + p.watched + ' of ' + p.total + ' watched' +
          (p.unsure ? ' • ' + p.unsure + ' unsure' : '') + (p.dnf ? ' • ' + p.dnf + ' DNF' : '') +
          (p.avg !== null ? ' • avg ' + (Math.round(p.avg * 10) / 10) : '') + '</div>' +
        (p.next ? '<div class="small faint" style="margin-top:4px">Next: ' + a.esc(p.next.key) + '</div>' : '') +
      '</div>';
    }).join('');
    return a.topBar('Collections', 'Every list you own, nothing you have to scroll a spreadsheet for. 📚') +
      '<div class="toolbar">' + tabs + '</div>' +
      '<div class="toolbar"><span class="muted">' + a.esc(fam.blurb) + ' ' + fp.lists + ' list' + (fp.lists === 1 ? '' : 's') + ', ' +
        fp.watched + ' of ' + fp.total + ' films watched (' + a.pct(fp.total ? fp.watched / fp.total : 0) + ').</span><span class="grow"></span>' +

  }

    var s = String(fr.entry.slot || '');
    return !s ? '#' + fr.n : /^\d+$/.test(s) ? '#' + s : s;
  }

  function frameHtml(a, fr) {
    var f = fr.film;
    var cls = 'fr' + (fr.lit ? ' lit' : '') + (fr.dnf ? ' dnf' : '') + (fr.next ? ' next' : fr.trackNext ? ' tnext' : '') + (fr.unsure ? ' unsure' : '');
    var r = f.rating !== null && f.rating !== undefined;
    var tip = f.key + ' · ' + (fr.next ? 'Next up' : f.status) + (r ? ' · ' + f.rating + '/10' : '') + ' · click to open';

      (fr.next ? '<span class="flag">NEXT UP</span>' : fr.trackNext ? '<span class="flag">NEXT HERE</span>' : fr.unsure ? '<span class="flag">UNSURE</span>' : '') +
      (fr.lit && r ? '<span class="rt">' + f.rating + '</span>' : '') +
      '</div><div class="fc"><b>' + a.esc(frameLabel(fr)) + '</b>' + a.esc(f.title) + (f.year ? ' (' + a.esc(f.year) + ')' : '') + '</div></div>';
  }

  /** Watched, DNF, unsure and still-to-watch as one stacked bar. */
  function fsBar(a, p) {
    var seg = function (n, cls, label) {
      return n ? '<i class="' + cls + '" style="width:' + (n / p.total * 100) + '%" title="' + a.esc(n + ' ' + label) + '"></i>' : '';
    };
    return '<div class="fsbar">' + seg(p.watched, 'w', 'watched') + seg(p.dnf, 'd', 'DNF') + seg(p.unsure, 'u', 'unsure') + '</div>' +
      '<div class="fslegend"><b>' + a.pct(p.pct) + '</b>' +
        '<span><i class="w"></i>' + p.watched + ' watched</span>' +
        '<span><i></i>' + p.notWatched + ' remaining</span>' +
        (p.unsure ? '<span><i class="u"></i>' + p.unsure + ' unsure</span>' : '') +

  }

  function branchEditor(a, x) {
    var names = {};
    x.frames.forEach(function (fr) { if (fr.branch) names[fr.branch] = 1; });
    var listId = 'fsbl_' + x.coll.collection_id;
    return '<div class="fsedit"><div class="small muted" style="margin-bottom:8px">Give an entry a branch name to put it on its own track (say <i>Annabelle</i> or <i>The Nun</i> for The Conjuring). ' +
        'Leave it blank for the main line. Order within each track still follows the list order.</div>' +
      '<datalist id="' + a.esc(listId) + '">' + Object.keys(names).map(function (n) { return '<option value="' + a.esc(n) + '">'; }).join('') + '</datalist>' +
      x.frames.map(function (fr) {
        return '<div class="row"><span class="t small"><span class="faint">' + a.esc(frameLabel(fr)) + '</span> ' + a.esc(fr.film.key) + '</span>' +
          '<input class="input" list="' + a.esc(listId) + '" data-fsbranch="' + a.esc(fr.entry.id) + '" value="' + a.esc(fr.branch) + '" placeholder="Main line" style="width:220px"></div>';
      }).join('') +
      '<div class="toolbar" style="margin-top:10px"><button class="btn primary" data-fsbsave="' + a.esc(x.coll.collection_id) + '">Save branches</button>' +
      '<button class="btn ghost" data-fsbedit="">Cancel</button></div></div>';
  }

  /** Franchise Filmstrip: each franchise as a reel of posters in order. Watched lights up, the next one glows. */
  function renderFilmstrip(a, M, tabs) {
    rememberScroll(a);
    var list = CollLogic.filmstrips(M, st.fsShow, st.fsSort);
    var all = CollLogic.filmstrips(M, '', 'order');
    var done = all.filter(function (x) { return x.state === 'Complete'; }).length;
    var going = all.filter(function (x) { return x.p.watched > 0 && x.state !== 'Complete'; }).length;
    var opt = function (cur) {
      return function (o) { return '<option value="' + a.esc(o[0]) + '"' + (cur === o[0] ? ' selected' : '') + '>' + a.esc(o[1]) + '</option>'; };
    };
    var reels = list.map(function (x) {
      var c = x.coll, p = x.p;
      var branched = x.tracks.length > 1 || (x.tracks[0] && x.tracks[0].name);
      var trackHtml = x.tracks.map(function (t) {
        var lit = t.frames.filter(function (fr) { return fr.film.status === 'Watched'; }).length;
        return (branched ? '<div class="fstrack"><span>' + (t.name ? '⑂ ' + a.esc(t.name) : '🔪 Main line') + '</span><span class="faint">' + lit + '/' + t.frames.length + '</span></div>' : '') +
          '<div class="fstrip" data-fs="' + a.esc(c.collection_id + '|' + t.name) + '"><div class="reel">' + t.frames.map(function (fr) { return frameHtml(a, fr); }).join('') + '</div></div>';
      }).join('');
      var nextFr = x.frames.filter(function (fr) { return fr.next; })[0];
      var complete = p.total && x.state === 'Complete';
      return '<div class="panel fsr' + (complete ? ' fsdone' : '') + '">' +
        '<div class="fsh"><h3 data-copen="' + a.esc(c.collection_id) + '" title="Open the list">' + a.esc(c.icon) + ' ' + a.esc(c.name) + '</h3>' + stateBadge(x.state) +

          (nextFr ? '<span class="small">Next up: ' + a.filmLink(nextFr.film) + '</span>'
            : complete ? '<button class="btn small" data-fsparty="' + a.esc(c.collection_id) + '">Every frame lit 🩸 Relive it</button>' : '') +
          (x.frames.length ? '<button class="btn ghost small" data-fsbedit="' + a.esc(st.fsEdit === c.collection_id ? '' : c.collection_id) + '" title="Split connected universes onto their own tracks">⑂ Branches</button>' : '') +
        '</div>' +
        (p.total ? fsBar(a, p) : '') +
        (x.frames.length ? trackHtml : '<div class="empty">No films on this franchise yet. Open it to add some.</div>') +
        (st.fsEdit === c.collection_id ? branchEditor(a, x) : '') +
      '</div>';
    }).join('');
    setTimeout(function () { restoreScroll(a); }, 0);
    return a.topBar('Collections', 'Every list you own, nothing you have to scroll a spreadsheet for. 📚') +
      '<div class="toolbar">' + tabs + '</div>' +
      '<div class="toolbar"><span class="muted">Every franchise as a reel, in your order. Watched frames light up, the next one glows, click any poster to open it. ' +
        all.length + ' franchise' + (all.length === 1 ? '' : 's') + ', ' + going + ' on the go, ' + done + ' complete.</span></div>' +
      '<div class="toolbar"><div class="seg">' + FS_SHOW.map(function (o) {
          return '<button data-fsshow="' + o[0] + '" class="' + (st.fsShow === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
        }).join('') + '</div>' +
        '<select data-fssort>' + FS_SORT.map(opt(st.fsSort)).join('') + '</select>' +
        '<span class="grow"></span><span class="seg">' + FS_SIZES.map(function (z) {
          return '<button data-fssize="' + z[1] + '" class="' + (st.fsSize === z[1] ? 'on' : '') + '" style="min-width:34px">' + z[0] + '</button>';
        }).join('') + '</span></div>' +
      (reels ? '<div style="--fw:' + st.fsSize + 'px">' + reels + '</div>'
        : '<div class="panel empty">' + (all.length ? 'No franchises match that filter.' : 'No franchises yet. Make one in the 🔪 Franchise tab.') + '</div>');
  }

  /** The finished-franchise party: every poster lit, the best and worst of the bunch. */
  function showParty(a, collId) {
    var M = a.model(), c = M.coll[collId];
    if (!c) return;
    var p = CollLogic.progress(M, collId);
    var seen = {}, films = [];
    (M.entriesByColl[collId] || []).forEach(function (e) { if (!seen[e.film]) { seen[e.film] = 1; films.push(M.byId[e.film]); } });
    var rated = films.filter(function (f) { return f.rating !== null && f.rating !== undefined; })
      .sort(function (x, y) { return y.rating - x.rating || (x.year || 0) - (y.year || 0); });
    var best = rated[0], worst = rated.length > 1 ? rated[rated.length - 1] : null;
    var years = films.map(function (f) { return f.year; }).filter(function (y) { return y; });
    var span = years.length ? Math.min.apply(null, years) + (Math.max.apply(null, years) !== Math.min.apply(null, years) ? '–' + Math.max.apply(null, years) : '') : '';
    var drops = '';
    for (var i = 0; i < 34; i++) {
      drops += '<i style="left:' + Math.round(Math.random() * 100) + '%;animation-delay:' + (Math.random() * 1.6).toFixed(2) + 's;animation-duration:' +
        (1.6 + Math.random() * 1.6).toFixed(2) + 's;transform:scale(' + (0.6 + Math.random() * 0.9).toFixed(2) + ')"></i>';
    }
    var n = films.length, fan = films.slice(0, 14);
    var el = document.createElement('div');
    el.className = 'reveal';
    el.innerHTML = '<div class="rain">' + drops + '</div><div class="revealcard fsparty"><div class="rays"></div>' +
      '<div class="kicker">Franchise complete</div>' +
      '<div class="rname">' + a.esc(c.icon) + ' ' + a.esc(c.name) + '</div>' +
      '<div class="rtier">' + n + ' film' + (n === 1 ? '' : 's') + (span ? ' · ' + a.esc(span) : '') + (p.avg !== null ? ' · avg ' + (Math.round(p.avg * 10) / 10) + '/10' : '') + '</div>' +
      '<div class="fan">' + fan.map(function (f, k) {
        var rot = fan.length > 1 ? (k - (fan.length - 1) / 2) * Math.min(7, 50 / fan.length) : 0;
        return '<div class="fanp" style="transform:rotate(' + rot.toFixed(1) + 'deg);animation-delay:' + (0.15 + k * 0.07).toFixed(2) + 's">' +
          (f.poster ? '<img src="' + a.esc(f.poster) + '" alt="">' : '<div class="noimg">' + a.esc(f.title) + '</div>') + '</div>';
      }).join('') + '</div>' +
      (n > fan.length ? '<div class="small muted">+ ' + (n - fan.length) + ' more</div>' : '') +
      '<div class="rdetail">' + (best ? '👑 Crown jewel: <b>' + a.esc(best.key) + '</b> (' + best.rating + ')' : 'Not a single rating. Bold.') +
        (worst && worst.rating < best.rating ? '<br>💀 Weakest link: <b>' + a.esc(worst.key) + '</b> (' + worst.rating + ')' : '') +
        (p.dnf ? '<br>⚰️ ' + p.dnf + ' DNF along the way. We don’t talk about those.' : '') + '</div>' +
      '<div class="small muted" style="margin-top:10px">Every frame lit. Survived the whole thing.</div>' +
      '<div style="margin-top:18px"><button class="btn primary" data-partyok>Hell yeah 🩸</button></div></div>';
    document.body.appendChild(el);
    el.addEventListener('click', function (ev) {
      if (ev.target.closest('[data-partyok]') || ev.target === el) el.remove();
    });
  }

  /** After any save: throws the party for franchises that just became complete. */
  function checkParty() {
    var a = App.api, M = a.model();
    if (!M) return;
    M.raw.fun = M.raw.fun || {};
    var complete = M.collList.filter(function (c) {
      if (c.family !== 'Franchise') return false;
      var p = CollLogic.progress(M, c.collection_id);
      return p.total > 0 && CollLogic.franchiseState(p.watched, p.total, p.unsure) === 'Complete';
    }).map(function (c) { return c.collection_id; });
    var seen = M.raw.fun.franchises_done;
    var r = CollLogic.celebrations(seen, complete);
    if (!seen || r.done.length !== seen.length || r.fresh.length) {
      M.raw.fun.franchises_done = r.done;
      a.call('apiSaveUiSetting', 'franchises_done', r.done).catch(function () {});
    }
    r.fresh.forEach(function (id) { showParty(a, id); });
  }
  window.FilmstripParty = { check: checkParty };

  /** Re-renders replace the reels, so keep each one's sideways scroll; a reel seen for the first time scrolls to its next-up frame. */
  function rememberScroll(a) {
    Array.prototype.forEach.call(document.querySelectorAll('.fstrip[data-fs]'), function (el) { st.fsScroll[el.dataset.fs] = el.scrollLeft; });
  }

  function restoreScroll(a) {
    Array.prototype.forEach.call(document.querySelectorAll('.fstrip[data-fs]'), function (el) {
      el.style.scrollBehavior = 'auto';
      var saved = st.fsScroll[el.dataset.fs];
      if (saved !== undefined) el.scrollLeft = saved;
      else {
        var nx = el.querySelector('.fr.next');
        if (nx) el.scrollLeft = Math.max(0, nx.offsetLeft - el.clientWidth / 3);
        st.fsScroll[el.dataset.fs] = el.scrollLeft;
      }
      el.style.scrollBehavior = '';
    });
  }

  function renderList(a, M) {
    var c = M.coll[st.coll];
    var p = CollLogic.progress(M, c.collection_id);
    var bubble = c.family === 'Bubblegum';
    var es = (M.entriesByColl[c.collection_id] || []).filter(function (e) {
      var f = M.byId[e.film];
      if (st.show === 'todo') return f.status === 'Not watched' || f.status === 'Unsure';
      if (st.show === 'done') return f.status === 'Watched' || f.status === 'DNF';
      return true;
    });
    var all = M.entriesByColl[c.collection_id] || [];
    var cunts = bubble ? all.map(function (e) { var s = M.byId[e.film].special; return s && s[0]; }).filter(function (x) { return x; }) : [];
    var stats = [['Watched', p.watched + '/' + p.total], ['Complete', a.pct(p.pct)], ['Unwatched', p.notWatched],
      ['Avg rating', p.avg === null ? '—' : Math.round(p.avg * 10) / 10]];
    if (c.family === 'Franchise') stats.push(['State', CollLogic.franchiseState(p.watched, p.total, p.unsure)]);
    if (c.family === 'Bestiary') stats.push(['Trophy', CollLogic.bestiaryTier(M, p.watched) || 'None yet']);
    if (bubble) stats.push(['Avg 💅🏻', cunts.length ? Math.round(cunts.reduce(function (s, x) { return s + x; }, 0) / cunts.length * 10) / 10 + '/5' : '—']);
    var slotLabel = c.family === 'Alphabet' ? 'Letter' : c.family === 'Franchise' ? 'Entry' : 'Slot';

    var rows = es.map(function (e) {
      var f = M.byId[e.film];
      var i = all.indexOf(e);
      return '<tr><td class="faint small">' + (i + 1) + '</td>' +
        '<td><a class="film-link small" data-cslot="' + a.esc(e.id) + '" title="Edit">' + (e.slot ? a.esc(e.slot) : '<span class="faint">set</span>') + '</a></td>' +
        '<td>' + a.filmLink(f) + (e.contextNote ? '<div class="small faint">' + a.esc(e.contextNote) + '</div>' : '') + '</td>' +
        '<td>' + a.statusChip(f.status) + '</td><td>' + a.ratingCell(f) + '</td>' +
        (bubble ? '<td>' + (f.special && f.special[0] ? '<b>' + f.special[0] + '</b>/5' : '<span class="faint">—</span>') + '</td>' : '') +
        '<td class="small muted">' + a.esc(e.sourceNote || '') + '</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="btn ghost small" data-cmove="' + a.esc(e.id) + '" data-to="' + (i - 1) + '"' + (i === 0 ? ' disabled' : '') + ' title="Move up">↑</button>' +
          '<button class="btn ghost small" data-cmove="' + a.esc(e.id) + '" data-to="' + (i + 1) + '"' + (i === all.length - 1 ? ' disabled' : '') + ' title="Move down">↓</button>' +
          '<button class="btn ghost small" data-cremove="' + a.esc(e.id) + '" title="Remove from this list">✕</button></td></tr>';
    }).join('');

    var hits = st.q.trim() ? HQ.search(M, st.q).slice(0, 8) : [];
    var onList = {};
    all.forEach(function (e) { onList[e.film] = true; });

    return a.topBar(c.icon + ' ' + c.name, '<a class="film-link" data-cback>← ' + a.esc(c.family) + '</a>' + (c.description ? ' • ' + a.esc(c.description) : '')) +
      '<div class="stats" style="grid-template-columns:repeat(' + stats.length + ',1fr)">' + stats.map(function (s) {
        return '<div class="stat"><span>' + a.esc(s[0]) + '</span><b>' + a.esc(s[1]) + '</b></div>';
      }).join('') + '</div>' +
      '<div class="panel">' +
        '<div class="toolbar"><div class="seg">' + [['', 'All'], ['todo', 'Still to watch'], ['done', 'Done']].map(function (o) {
          return '<button data-cshow="' + o[0] + '" class="' + (st.show === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
        }).join('') + '</div><span class="grow"></span>' +
        '<button class="btn ghost" data-cedit>' + (LOCKED[c.family] ? 'Edit description' : 'Rename / edit') + '</button></div>' +
        '<div class="search" style="width:100%;margin-bottom:14px"><input id="cadd" placeholder="Add a film to ' + a.esc(c.name) + ': type a title, or Title (YYYY) for a new one" value="' + a.esc(st.q) + '" autocomplete="off"></div>' +
        (st.q.trim() ? '<div class="panel" style="margin:-6px 0 14px;padding:8px 14px">' + (hits.length ? hits.map(function (f) {
            return '<div class="row"><span class="t">' + a.esc(f.key) + ' ' + a.statusChip(f.status) + '</span>' +
              (onList[f.id] ? '<span class="small faint">already here</span>' : '<button class="btn" data-caddfilm="' + a.esc(f.id) + '">Add</button>') + '</div>';
          }).join('') : '') +
          '<div class="row"><span class="t muted small">Not there? Add it as a brand-new film.</span><button class="btn" data-cnewfilm>New film…</button></div></div>' : '') +
        (rows ? '<table><thead><tr><th>#</th><th>' + slotLabel + '</th><th>Film</th><th>Status</th><th>Rating</th>' + (bubble ? '<th>💅🏻 /5</th>' : '') +
          '<th>Source</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' : '<div class="empty">Nothing here' + (st.show ? ' with that filter' : ' yet') + '.</div>') +
      '</div>';
  }

  function render(a) {
    var M = a.model();
    if (st.coll && !M.coll[st.coll]) st.coll = null;
    return st.coll ? renderList(a, M) : renderOverview(a, M);
  }

  function addFilmTo(a, M, filmId) {
    var c = M.coll[st.coll];
    var slot = c.family === 'Alphabet' ? prompt('Letter for ' + M.byId[filmId].title + ':', M.byId[filmId].title.charAt(0).toUpperCase()) : '';
    if (slot === null) return;
    return a.call('apiAddEntry', c.collection_id, filmId, slot || '', '', false).then(function (rec) {
      HQ.addEntry(M, { id: rec.entry_id, coll: rec.collection_id, film: rec.film_id, slot: rec.slot_label, seq: rec.sequence, sourceNote: '', contextNote: '' });
      HQ.sortEntries(M);
      st.q = '';
      a.render();
      a.toast('Added ' + M.byId[filmId].title + ' to ' + c.name, 'ok');
    }).catch(function (e) { a.toast(e.message, 'bad'); });
  }

  function newFilmThenAdd(a, M) {
    var m = st.q.trim().match(/^(.*\S)\s*\((\d{4})\)$/);
    var title = m ? m[1] : prompt('Film title (without the year):', st.q.trim());
    if (!title) return;
    var year = m ? m[2] : prompt('Release year for ' + title + ':');
    if (!year) return;
    a.call('apiAddFilm', title, Number(year), false).then(function (res) {
      if (!res.created) {
        a.toast('Already known (' + res.via + '): ' + res.film.display_key, 'ok');
        if (!M.byId[res.film.film_id]) return;
        return addFilmTo(a, M, res.film.film_id);
      }
      var f = { id: res.film.film_id, key: res.film.display_key, title: res.film.title, year: res.film.release_year, poster: '',
        status: 'Not watched', rating: null, reaction: '', version: 1, modified: res.state.modified_at, countries: [], memory: null, special: null, aliases: [] };
      f.search = HQ.normalise(f.key) + ' ' + f.id.toLowerCase();
      M.films.push(f); M.byId[f.id] = f;
      return addFilmTo(a, M, f.id);
    }).catch(function (e) { a.toast(e.message, 'bad'); });
  }

  function onClick(ev, a) {
    var fb = ev.target.closest('[data-fsbedit],[data-fsbsave],[data-fsparty]');
    if (fb) {
      if (fb.dataset.fsparty) { showParty(a, fb.dataset.fsparty); return true; }
      if (fb.dataset.fsbedit !== undefined) { st.fsEdit = fb.dataset.fsbedit; a.render(); return true; }
      var cid = fb.dataset.fsbsave, M0 = a.model();
      M0.raw.fun = M0.raw.fun || {};
      var allB = JSON.parse(JSON.stringify(M0.raw.fun.franchise_branches || {})), mine = {};
      Array.prototype.forEach.call(document.querySelectorAll('[data-fsbranch]'), function (inp) {
        var v = inp.value.trim().slice(0, 40);
        if (v) mine[inp.dataset.fsbranch] = v;
      });
      if (Object.keys(mine).length) allB[cid] = mine; else delete allB[cid];
      a.call('apiSaveUiSetting', 'franchise_branches', allB).then(function () {
        M0.raw.fun.franchise_branches = allB; st.fsEdit = ''; st.fsScroll = {}; a.render(); a.toast('Branches saved', 'ok');
      }).catch(function (e) { a.toast('Not saved: ' + e.message, 'bad'); });
      return true;
    }
    var fs = ev.target.closest('[data-fsshow],[data-fssize]');
    if (fs) {
      if (fs.dataset.fssize) st.fsSize = Number(fs.dataset.fssize);
      else st.fsShow = fs.dataset.fsshow;
      st.fsScroll = {};
      a.render();
      return true;
    }
    var t = ev.target.closest('[data-cfam],[data-copen],[data-cback],[data-cshow],[data-cmove],[data-cremove],[data-cslot],[data-caddfilm],[data-cnewfilm],[data-cnew],[data-cedit]');
    if (!t) return false;
    var d = t.dataset, M = a.model();
    if (d.cfam) { st.family = d.cfam; st.coll = null; a.render(); return true; }
    if (d.copen) { st.coll = d.copen; st.show = ''; st.q = ''; window.scrollTo(0, 0); a.render(); return true; }
    if (d.cback !== undefined) { st.coll = null; a.render(); return true; }
    if (d.cshow !== undefined) { st.show = d.cshow; a.render(); return true; }
    if (d.cmove) {
      var to = Number(d.to);
      a.call('apiMoveEntry', d.cmove, to).then(function (ids) {
        ids.forEach(function (id, i) { if (M.entryById[id]) M.entryById[id].seq = i + 1; });
        HQ.sortEntries(M); a.render();
      }).catch(function (e) { a.toast('Not moved: ' + e.message, 'bad'); });
      return true;
    }
    if (d.cremove) {
      var e = M.entryById[d.cremove], f = M.byId[e.film], c = M.coll[e.coll];
      if (!confirm('Remove ' + f.title + ' from ' + c.name + '? Its rating and other lists stay as they are.')) return true;
      a.call('apiRemoveEntry', e.id).then(function () { HQ.removeEntry(M, e.id); a.render(); a.toast('Removed from ' + c.name, 'ok'); })
        .catch(function (err) { a.toast('Not removed: ' + err.message, 'bad'); });
      return true;
    }
    if (d.cslot) {
      var en = M.entryById[d.cslot];
      var label = prompt('Slot / label for ' + M.byId[en.film].title + ':', en.slot || '');
      if (label === null) return true;
      a.call('apiUpdateEntry', en.id, { slot_label: label }).then(function (rec) { en.slot = rec.slot_label; a.render(); })
        .catch(function (err) { a.toast(err.message, 'bad'); });
      return true;
    }
    if (d.caddfilm) { addFilmTo(a, M, d.caddfilm); return true; }
    if (d.cnewfilm !== undefined) { newFilmThenAdd(a, M); return true; }
    if (d.cnew !== undefined) {
      var name = prompt('Name for the new ' + st.family + ' list:');
      if (!name) return true;
      a.call('apiCreateCollection', st.family, name, '', '').then(function (rec) {
        M.coll[rec.collection_id] = rec; M.collList.push(rec); M.entriesByColl[rec.collection_id] = [];
        st.coll = rec.collection_id; a.render(); a.toast('Created ' + rec.name, 'ok');
      }).catch(function (err) { a.toast(err.message, 'bad'); });
      return true;
    }
    if (d.cedit !== undefined) {
      var cc = M.coll[st.coll], patch = {};
      if (!LOCKED[cc.family]) {
        var nn = prompt('List name:', cc.name);
        if (nn === null) return true;
        patch.name = nn;
      }
      var desc = prompt('Description (optional):', cc.description || '');
      if (desc === null) return true;
      patch.description = desc;
      a.call('apiUpdateCollection', cc.collection_id, patch).then(function (rec) {
        cc.name = rec.name; cc.description = rec.description; a.render(); a.toast('Saved', 'ok');
      }).catch(function (err) { a.toast(err.message, 'bad'); });
      return true;
    }
    return false;
  }

  function onInput(ev, a) {
    if (ev.target.id !== 'cadd') return false;
    st.q = ev.target.value;
    var pos = ev.target.selectionStart;
    a.render();
    var again = a.$('#cadd'); again.focus(); again.setSelectionRange(pos, pos);
    return true;
  }

  function onChange(ev, a) {
    if (ev.target.dataset.fssort === undefined) return false;
    st.fsSort = ev.target.value;
    st.fsScroll = {};
    a.render();
    return true;
  }

  App.view('collections', { render: render, onClick: onClick, onInput: onInput, onChange: onChange });
})();
</script>
